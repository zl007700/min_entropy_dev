<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 210" role="img" aria-labelledby="title desc">
  <title id="title">Min Entropy Dev development loop</title>
  <desc id="desc">A product proposal passes through proposal, value, entropy, and test gates before merging and beginning the next round.</desc>
  <style>
    text {
      fill: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }
    .small { fill: #9da7b3; font-size: 12px; }
    .node { fill: #161b22; stroke: #66707b; stroke-width: 1.5; }
    .gate { fill: #172554; stroke: #58a6ff; stroke-width: 1.5; }
    .path { fill: none; stroke: #58a6ff; stroke-width: 2; }
    .return { fill: none; stroke: #3fb950; stroke-width: 2; }
  </style>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1118" height="208" rx="8" fill="#0d1117" stroke="#30363d"/>

  <rect class="node" x="24" y="58" width="120" height="54" rx="6"/>
  <text x="84" y="89" text-anchor="middle">Product</text>

  <path class="path" d="M144 85H169" marker-end="url(#arrow-blue)"/>
  <path class="gate" d="M235 36L301 85L235 134L169 85Z"/>
  <text x="235" y="81" text-anchor="middle">Proposal</text>
  <text class="small" x="235" y="99" text-anchor="middle">gate</text>

  <path class="path" d="M301 85H326" marker-end="url(#arrow-blue)"/>
  <rect class="node" x="327" y="58" width="84" height="54" rx="6"/>
  <text x="369" y="89" text-anchor="middle">Dev</text>

  <path class="path" d="M411 85H436" marker-end="url(#arrow-blue)"/>
  <rect class="node" x="437" y="58" width="126" height="54" rx="6"/>
  <text x="500" y="89" text-anchor="middle">Pull request</text>

  <path class="path" d="M563 85H588" marker-end="url(#arrow-blue)"/>
  <path class="gate" d="M666 30L744 85L666 140L588 85Z"/>
  <text x="666" y="81" text-anchor="middle">Value / entropy</text>
  <text class="small" x="666" y="99" text-anchor="middle">gate</text>

  <path class="path" d="M744 85H769" marker-end="url(#arrow-blue)"/>
  <rect class="node" x="770" y="58" width="84" height="54" rx="6"/>
  <text x="812" y="89" text-anchor="middle">Test</text>

  <path class="path" d="M854 85H879" marker-end="url(#arrow-blue)"/>
  <rect class="node" x="880" y="58" width="104" height="54" rx="6"/>
  <text x="932" y="89" text-anchor="middle">Merge</text>

  <path class="return" d="M932 112V161C932 176 920 184 905 184H103C88 184 84 171 84 154V116" marker-end="url(#arrow-green)"/>
  <text class="small" x="508" y="176" text-anchor="middle">accepted repository state becomes the next round</text>
</svg>
